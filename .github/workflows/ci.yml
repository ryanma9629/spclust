# SPDX-License-Identifier: MIT
name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # numpy drives the Python binding tests and scipy the interop test; both skip
      # themselves when absent. They go into a virtualenv because the runners' system
      # Python is externally managed (PEP 668) and refuses a plain `pip install`.
      # CMake is pointed at this interpreter as well, so the ctest entries use it too.
      - name: Python dependencies (virtualenv)
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install numpy scipy

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DPython3_EXECUTABLE=$PWD/.venv/bin/python

      - name: Build (library + CLI + tests)
        run: cmake --build build --parallel

      - name: Test (cut properties + differential + CLI + C API + scipy + Python binding)
        run: ctest --test-dir build --output-on-failure

      - name: The linkage must be a run-time choice (one binary, three different results)
        run: |
          set -e
          for m in 0 1 2; do
            ./build/spclust_cli sim.csv --linkage "$m" --matrix > "/tmp/m$m.txt"
          done
          if cmp -s /tmp/m0.txt /tmp/m1.txt && cmp -s /tmp/m0.txt /tmp/m2.txt; then
            echo "all three linkages produced identical output, which is suspicious"; exit 1
          fi

      - name: Sanitizers (ASan/UBSan over the case corpus)
        run: make asan-cases

      - name: Python binding against the shared library, outside CMake
        run: |
          make                      # the CLI binary the comparison cross-checks against
          make lib-shared
          PYTHONPATH=python .venv/bin/python tests/test_python.py \
            --lib ./libspclust.so --cli ./spclust

      - name: Library-only build (proves no dependency on tools/ and that the options work)
        run: |
          set -e
          cmake -S . -B build-libonly -DSPCLUST_BUILD_TOOLS=OFF -DSPCLUST_BUILD_TESTS=OFF
          cmake --build build-libonly --parallel
          test -f build-libonly/libspclust.a
          test ! -e build-libonly/spclust_cli
          test ! -e build-libonly/cut_property

# SPDX-License-Identifier: MIT
name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (库 + CLI + 三种 linkage 测试二进制)
        run: cmake --build build --parallel

      - name: Test (差分测试 + CLI 契约测试)
        run: ctest --test-dir build --output-on-failure

      - name: Sanitizers (ASan/UBSan over the case corpus)
        run: make asan-cases

      - name: 只编库（验证库不依赖 tools/）
        run: |
          cmake -S . -B build-libonly -DSPCLUST_BUILD_TOOLS=OFF -DSPCLUST_BUILD_TESTS=OFF
          cmake --build build-libonly --parallel
